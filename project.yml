name: Kilncast
packages:
  Alamofire:
    url: https://github.com/ymvmj7dsyy-stack/Alamofire
    revision: 3ea8e93ec37a3ae5f255afb529ef20f438dd1903
options:
  bundleIdPrefix: com.kilncast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Kilncast:
    type: application
    platform: iOS
    sources:
      - path: Kilncast
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kilncast.wall
        PRODUCT_NAME: Kilncast
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Kilncast
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: kln_background
        INFOPLIST_KEY_UILaunchScreen_UIImageName: kln_Splash
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  KilncastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KilncastTests
    dependencies:
      - target: Kilncast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kilncast.wall.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kilncast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kilncast"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
  KilncastShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KilncastShotTests
    dependencies:
      - target: Kilncast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kilncast.wall.tests.shots
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kilncast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kilncast"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Kilncast:
    build:
      targets:
        Kilncast: all
        KilncastTests: [test]
    test:
      targets:
        - KilncastTests
  KilncastShots:
    build:
      targets:
        Kilncast: all
        KilncastShotTests: [test]
    test:
      targets:
        - KilncastShotTests
